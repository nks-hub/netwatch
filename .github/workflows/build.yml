# NetWatch CI — builds the portable net48 EXE and publishes it.
#
# - build:   runs on every push to main, on v* tags, and on manual dispatch;
#            compiles netwatch.csproj (Release) and uploads the EXE artifact.
# - release: runs only for v* tag pushes; attaches the EXE to a GitHub Release.
#
# Third-party actions are pinned to a full commit SHA (with a version comment)
# for supply-chain safety. Permissions are least-privilege: read by default,
# and contents:write only on the release job. Uses the built-in GITHUB_TOKEN.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build netwatch.csproj -c Release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netwatch
          path: |
            bin/Release/net48/netwatch.exe
            bin/Release/net48/netwatch.exe.config
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: netwatch
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: NetWatch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/netwatch.exe
            dist/netwatch.exe.config
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
